<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTORBASE — Sistema Rápido de Taller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Configuración Oficial de Paleta Tailwind CSS MOTORBASE -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'motorbase-dark': '#070b14',
                        'motorbase-card': '#0f172a',
                        'motorbase-blue': '#0066ff',
                        'motorbase-cyan': '#00c6ff',
                        'motorbase-success': '#10b981',
                        'motorbase-danger': '#ef4444',
                        'motorbase-warning': '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070b14;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Scrollbar personalizado para Dark Mode */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #070b14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        /* Ergonomía táctil Touch-First */
        .touch-target {
            min-height: 52px;
        }
        .touch-btn-sm {
            min-height: 44px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-motorbase-dark text-slate-100 min-h-screen flex flex-col antialiased selection:bg-motorbase-blue selection:text-white">

    <!-- ===================================================================== -->
    <!-- PANTALLA INICIAL OBLIGATORIA: P-00 LOGIN                              -->
    <!-- ===================================================================== -->
    <section id="view-login" class="flex-1 flex items-center justify-center p-4 min-h-screen bg-motorbase-dark">
        <div class="w-full max-w-md bg-motorbase-card border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">

            <!-- Logotipo Institucional SVG Inline con Estética Automotriz -->
            <div class="flex flex-col items-center justify-center mb-6">
                <div class="flex items-center gap-3 mb-3">
                    <img src="logo-motorbase.png" alt="Logotipo MOTORBASE" class="w-12 h-12 rounded-xl object-contain">
                    <span class="text-2xl font-extrabold tracking-tight text-white">MOTOR<span class="text-motorbase-cyan">BASE</span></span>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 text-motorbase-cyan tracking-wider uppercase">
                    P-00 Login Obligatorio
                </span>
            </div>

            <div class="text-center mb-6">
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Acceso al Taller</h1>
                <p class="text-sm text-slate-400 mt-1">Acceso exclusivo para Administrador y Mecánico</p>
            </div>

            <!-- Mensaje de Error de Validación -->
            <div id="login-error" class="hidden mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500 text-red-500 text-sm font-semibold flex items-center gap-2.5">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
                <span>Credenciales inválidas</span>
            </div>

            <!-- Formulario de Autenticación Touch-First (52px) -->
            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="login-user" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                        Usuario (Admin / Mecánico)
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="login-user" autocomplete="off" placeholder="Ingrese su usuario"
                               class="touch-target w-full pl-11 pr-4 bg-motorbase-dark border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-motorbase-cyan focus:ring-1 focus:ring-motorbase-cyan transition">
                    </div>
                </div>

                <div>
                    <label for="login-pass" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                        Contraseña o PIN
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="login-pass" placeholder="••••••"
                               class="touch-target w-full pl-11 pr-4 bg-motorbase-dark border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-motorbase-cyan focus:ring-1 focus:ring-motorbase-cyan transition">
                    </div>
                </div>

                <button type="submit" 
                        class="touch-target w-full mt-2 bg-motorbase-blue hover:bg-blue-600 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-motorbase-blue/25 transition flex items-center justify-center gap-2 text-base">
                    <span>Ingresar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </section>

    <!-- ===================================================================== -->
    <!-- APLICACIÓN PRINCIPAL PROTEGIDA (POST-LOGIN P-00)                      -->
    <!-- ===================================================================== -->
    <div id="app-shell" class="hidden flex-1 flex flex-col min-h-screen">

        <!-- HEADER FIJO SUPERIOR -->
        <header class="sticky top-0 z-30 bg-motorbase-card/95 backdrop-blur border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3">
                <div class="flex flex-wrap items-center justify-between gap-3">

                    <!-- Logotipo Oficial y Rol -->
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2">
                            <img src="logo-motorbase.png" alt="Logotipo MOTORBASE" class="w-9 h-9 rounded-lg object-contain">
                            <span class="text-xl font-extrabold tracking-tight text-white">MOTOR<span class="text-motorbase-cyan">BASE</span></span>
                        </div>
                        <span id="header-role-badge" class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-motorbase-blue/20 text-motorbase-cyan border border-motorbase-blue/40">
                            Rol
                        </span>
                    </div>

                    <!-- Configuración Operativa: Nombre Visible del Mecánico + Botón Salir -->
                    <div class="flex items-center gap-2 sm:gap-3 flex-wrap sm:flex-nowrap w-full sm:w-auto justify-between sm:justify-end">
                        <div class="flex items-center gap-2 bg-motorbase-dark border border-slate-800 rounded-xl px-3 py-1.5 flex-1 sm:flex-initial">
                            <i data-lucide="hard-hat" class="w-4 h-4 text-motorbase-warning shrink-0"></i>
                            <label for="mechanic-name-input" class="text-xs text-slate-400 whitespace-nowrap hidden md:inline">Mecánico:</label>
                            <input type="text" id="mechanic-name-input" value="Carlos Mendoza" title="Personalizar nombre visible del mecánico"
                                   class="bg-transparent text-sm font-semibold text-white focus:outline-none w-full sm:w-40 border-b border-transparent focus:border-motorbase-cyan">
                        </div>

                        <button type="button" id="btn-logout" 
                                class="touch-btn-sm px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/50 border border-slate-700 text-slate-200 text-sm font-semibold transition flex items-center gap-2 shrink-0">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            <span>Salir</span>
                        </button>
                    </div>
                </div>

                <!-- PESTAÑAS TÁCTILES DE NAVEGACIÓN (5 PESTAÑAS OFICIALES) -->
                <nav class="flex items-center gap-2 overflow-x-auto pt-3 mt-3 border-t border-slate-800/80 no-scrollbar">
